name: Rigid Rotor Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy matplotlib

    - name: Run pytest
      run: |
        pytest test_rigid_rotor.py -v --tb=short

    - name: Run pytest with coverage (Python 3.11 only)
      if: matrix.python-version == '3.11'
      run: |
        pip install pytest-cov
        pytest test_rigid_rotor.py --cov=rigid_rotor --cov-report=term-missing
